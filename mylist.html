<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTV | My List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="streamtv.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Main navigation">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="STREAMTV.webp" alt="StreamTV logo" height="32">
                    <span>StreamTV</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="browse.html">Browse</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="mylist.html">My List</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li id="signinItem" class="nav-item"><a class="btn btn-outline-warning ms-lg-2" href="signin.html">Sign in</a></li>
                        <li id="logoutItem" class="nav-item" hidden><button type="button" id="logoutBtn" class="btn btn-outline-warning ms-lg-2">Log out</button></li>
                    </ul>
                    <form class="d-flex ms-lg-3" role="search">
                        <label for="search_input" class="visually-hidden">Search</label>
                        <input class="form-control me-2" type="search" id="search_input" placeholder="Search">
                        <button class="btn btn-warning" type="submit" aria-label="search">
                             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                 <circle cx="11" cy="11" r="8"></circle>
                                 <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                             </svg>
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="Mylist_heading">
            <h1>My List</h1>
            <p>Titles you have saved to watch later.</p>
            <p id="Mylist_count"></p>
        </section>

        <section id="Mylist" aria-label="Your saved titles">
            <div id="Mylist-grid" class="row g-3"></div>

            <div id="Mylist_empty" hidden>
                <p>Your list is empty.</p>
                <a href="browse.html" class="btn btn-warning">Browse the library</a>
            </div>
        </section>

        <section id="Mylist_actions" aria-label="List actions">
            <button type="button" id="Clear_list" class="btn btn-outline-warning">Clear my list</button>
        </section>

        <p id="Mylist_message" role="status" aria-live="polite"></p>
    </main>

    <footer>
        <nav aria-label="Footer navigation">
            <a href="about.html">About</a>
            <a href="about.html#faq">Help</a>
        </nav>
        <p>&copy; 2026 StreamTV. A student project for Principles of Web Design. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="nav.js"></script>
    <script src="movies.js"></script>
    <script src="data.js"></script>
    <script src="list.js"></script>
    <script src="cards.js"></script>
    <script src="mylist.js"></script>
</body>
</html>
