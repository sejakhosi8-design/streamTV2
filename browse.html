<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTV | Browse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="streamtv.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Main navigation">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="STREAMTV.webp" alt="StreamTV logo" height="32">
                    <span>StreamTV</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="browse.html">Browse</a></li>
                        <li class="nav-item"><a class="nav-link" href="mylist.html">My List</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li id="signinItem" class="nav-item"><a class="btn btn-outline-warning ms-lg-2" href="signin.html">Sign in</a></li>
                        <li id="logoutItem" class="nav-item" hidden><button type="button" id="logoutBtn" class="btn btn-outline-warning ms-lg-2">Log out</button></li>
                    </ul>
                    <form class="d-flex ms-lg-3" role="search">
                        <label for="search_input" class="visually-hidden">Search</label>
                        <input class="form-control me-2" type="search" id="search_input" placeholder="Search">
                        <button class="btn btn-warning" type="submit" aria-label="search">
                             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                 <circle cx="11" cy="11" r="8"></circle>
                                 <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                             </svg>
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="Browse_heading">
            <h1>Browse All Titles</h1>
            <p>Explore our full library of films and series.</p>
        </section>

        <section id="Filters" aria-label="Search and filter the library">
            <form class="row g-3">
                <div class="col-12 col-md-8">
                    <label for="browse_search">Search by title or description</label>
                    <input type="search" class="form-control" id="browse_search" placeholder="Type a title...">
                </div>
                <div class="col-12 col-md-4">
                    <label for="genre_filter">Genre</label>
                    <select id="genre_filter" class="form-select">
                        <option value="all">All genres</option>
                        <option value="Animation">Animation</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Horror">Horror</option>
                        <option value="Comedy">Comedy</option>
                    </select>
                </div>
            </form>
        </section>

        <p id="Data_status" class="data-status" role="status" aria-live="polite"></p>

        <section id="Library" aria-label="Library of titles">
            <h2>All Titles</h2>
            <div id="Library-grid" class="row g-3"></div>
            <p id="No_results" hidden>No titles match your search.</p>
        </section>

    </main>

    <footer>
        <nav aria-label="Footer navigation">
            <a href="about.html">About</a>
            <a href="about.html#faq">Help</a>
        </nav>
        <p>&copy; 2026 StreamTV. A student project for Principles of Web Design. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="nav.js"></script>
    <script src="movies.js"></script>
    <script src="data.js"></script>
    <script src="list.js"></script>
    <script src="cards.js"></script>
    <script src="browse.js"></script>
</body>
</html>
